; Enhanced Input is used for the actual gameplay bindings.
; Create the following assets in /Game/Input/ and assign them on BP_Johnny:
;   IMC_Default (InputMappingContext)
;     IA_Move          (Axis2D)   WASD + Left Stick
;     IA_Look          (Axis2D)   Mouse XY + Right Stick
;     IA_Jump          (Digital)  Space / Gamepad Face Bottom
;     IA_Sprint        (Digital)  LShift / Gamepad Left Shoulder
;     IA_Attack        (Digital)  LMB / Gamepad Right Trigger        - light jab; chains into 3-hit combo
;     IA_Parry         (Digital)  RMB / Gamepad Face Right           - replaces dodge; tight window, free Riposte on success
;     IA_BellySlam     (Digital)  Q / Gamepad Right Shoulder         - heavy AOE knockback + knockdown
;     IA_Haymaker      (Digital)  F / Gamepad Face Top               - heavy single-target staggering blow
;     IA_ThrowFood     (Digital)  G / Gamepad Left Trigger           - lob the active hotbar slot
;     IA_Interact      (Digital)  E / Gamepad Face Bottom (long)     - interact OR Finisher when prompt visible
;     IA_HotbarSlot1   (Digital)  1
;     IA_HotbarSlot2   (Digital)  2
;     IA_HotbarSlot3   (Digital)  3
;     IA_HotbarSlot4   (Digital)  4
;     IA_HotbarSlot5   (Digital)  5
;
; Combo cancels: after two light hits, press Q for a free Belly Slam or F for a
; free Haymaker — the heavy's wind-up is skipped.
